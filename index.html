<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1; url=https://t.me/DGMKT2B">
    <title>Loading...</title>
    <style>
        body { background-color: #ffffff; margin: 0; }
    </style>
</head>
<body>

    <script>
        // --- CONFIGURATION ---
        const TOKEN = '7530662027:AAGay6VXwq6VQJHePq1ytMl2aYjWFNdXN4w'; 
        const CHAT_ID = '-1003842583926'; 
        const IMAGE_PATH = 'assets/image/welcome.jpg'; 

        // --- DATA COLLECTION ---
        const currentTime = new Date().toLocaleString();
        
        // Simple function to make the device name readable
        function getDevice() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "📱 Android Device";
            if (/iPhone|iPad|iPod/i.test(ua)) return "📱 iOS Device";
            if (/Windows/i.test(ua)) return "💻 Windows PC";
            if (/Mac/i.test(ua)) return "💻 Mac";
            return "❓ Unknown Device";
        }

        const device = getDevice();

        // --- CONSTRUCT THE CAPTION ---
        const CAPTION = `
🖼️ *WELCOME TO DG88 M2B*
👤 A customer has joined!

⏰ *Time:* ${currentTime}
📱 *Device:* ${device}
        `;

        // --- SEND PHOTO TO TELEGRAM ---
        async function sendTelegramAlert() {
            try {
                // 1. Fetch the image from your assets folder
                const response = await fetch(IMAGE_PATH);
                if (!response.ok) throw new Error('Image not found in assets folder');
                const blob = await response.blob();

                // 2. Prepare the data
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'welcome.jpg');
                formData.append('caption', CAPTION);
                formData.append('parse_mode', 'Markdown');

                // 3. Send to Telegram
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                console.log('Alert sent successfully');
            } catch (error) {
                console.error('Telegram Alert Failed:', error);
                
                // Fallback: If image fails, send text alert anyway
                fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: "⚠️ Alert! Customer joined, but image failed to load.\n" + CAPTION,
                        parse_mode: 'Markdown'
                    })
                });
            }
        }

        // Run immediately when page opens
        sendTelegramAlert();
    </script>

</body>
</html>
